<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08080b">
  <meta name="description" content="RealStudio founder desk for clients, team, decisions and reports.">
  <title>Founder desk · RealStudio</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
      <div class="brand"><img class="brand-logo" src="/realstudio-logo.webp" alt="RealStudio"></div>
      <div class="brand-sub">FOUNDER DESK</div>
      <nav id="nav" class="nav">
        <button data-page="clients" class="nav-item active"><span class="nav-icon">▦</span> Clients <span class="nav-count">03</span></button>
        <button data-page="teammates" class="nav-item"><span class="nav-icon">◉</span> Teammates <span class="nav-count">27</span></button>
        <button data-page="decisions" class="nav-item"><span class="nav-icon">◇</span> Founder decisions <span class="nav-count">03</span></button>
        <button data-page="reports" class="nav-item"><span class="nav-icon">☷</span> Reports</button>
      </nav>
    </aside>
    <div class="main-wrap">
      <header class="topbar">
        <div class="mobile-brand"><img src="/realstudio-logo.webp" alt="RealStudio"></div>
        <div class="breadcrumbs">Founder desk <span>/</span> <strong id="crumb">Clients</strong></div>
        <div class="top-actions"><span class="top-avatar">R</span></div>
      </header>
      <main id="app" tabindex="-1"></main>
    </div>
  </div>
  <dialog id="video-dialog" class="modal"><button class="modal-close" aria-label="Close video">×</button><div class="modal-body"></div></dialog>
  <script src="app.js" defer></script>

</html>
